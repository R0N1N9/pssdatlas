[project]
name = "pssd-atlas"
version = "0.1.0"
description = "Living evidence map for post-SSRI sexual dysfunction and related persistent post-drug syndromes"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pssd-atlas = "pssd_atlas.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pssd_atlas"]

[tool.setuptools.package-data]
pssd_atlas = ["config.toml", "template.html", "app.js", "guide.toml"]
