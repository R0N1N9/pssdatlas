label = "Emotional blunting"
patterns = ['emotional(ly)? (blunt|numb|flat|indifferen)', 'apathy', 'blunted', "can'?t feel (emotions?|love|anything)", 'no emotions', 'feel nothing']

[[community.symptom]]
id = "anhedonia"
