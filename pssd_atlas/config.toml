[[community.symptom]]
id = "cognitive"
label = "Cognitive problems"
patterns = ['brain fog', 'cognit', 'memory impairment', 'concentration', 'memory (loss|problems|issues)', "can'?t (think|concentrate|focus)", 'blank mind']

[[community.symptom]]
id = "sleep"
label = "Sleep problems"
patterns = ['insomnia', 'sleep disturbance', 'sleep disorder', 'sleepiness', 'somnolence', "can'?t sleep", 'sleep (problems|issues)', 'unrefreshing']

[[community.symptom]]
id = "sensory"
label = "Other sensory changes"
patterns = ['skin numb', 'reduced (taste|smell)', 'tinnitus', 'visual snow', 'blurr(y|ed) vision', 'no goosebumps']

[[community.symptom]]
id = "spontaneous_erections"
label = "Loss of spontaneous / nocturnal erections"
patterns = ['nocturnal (penile )?(tumescence|erections?)', '(morning|spontaneous|sleep[- ]related|night[- ]?time) (erections?|wood)', '\bNPT\b']

[[community.symptom]]
id = "tissue_change"
label = "Genital tissue change (size, shape, fibrosis)"
patterns = ['fibros', 'atroph', 'shrinkage', 'shrunk', 'shrinking', 'penile (size|length|shorten|curvature|tissue|girth)', 'peyronie',
            'corpor(a|us) cavernos', 'hard flaccid', 'collagen', 'testicular (size|volume)', 'hourglass']

[[community.symptom]]
id = "dissociation"
label = "Dissociation / depersonalisation"
patterns = ['depersonali[sz]ation', 'dereali[sz]ation', 'dissociat', 'feel(ing)? unreal', 'disconnected from (my|the) (body|self)']

[[community.symptom]]
id = "akathisia"
label = "Akathisia / restlessness"
patterns = ['akathisia', 'inner restlessness', "can'?t sit still"]

# Treatments that appear in patient discussions but rarely in the literature.
[[community.intervention]]
id = "keto_fasting"
label = "Ketogenic diet / fasting"
patterns = ['\bketo(genic)?\b', '\bfast(ing|ed)\b', 'carnivore diet']

[[community.intervention]]
id = "antibiotics"
label = "Antibiotics"
patterns = ['antibiotics?', 'doxycycline', 'amoxicillin', 'rifaximin', 'augmentin']

[[community.intervention]]
id = "supplements"
label = "Vitamins / minerals / amino acids"
patterns = ['magnesium', '\bzinc\b', 'vitamin d', '\bB12\b', '\bNAC\b', 'omega[- ]?3', 'l-?citrulline', 'creatine', '5-?HTP', 'tyrosine']

[[community.intervention]]
id = "brain_stim"
label = "ECT / TMS"
patterns = ['\bECT\b', 'electroconvulsive', '\bTMS\b']

[[community.intervention]]
id = "cannabis"
label = "Cannabis"
patterns = ['cannabis', 'marijuana', '\bweed\b', '\bTHC\b', '\bCBD\b']

[[community.intervention]]
id = "exercise"
label = "Exercise / cold exposure"
patterns = ['exercis', 'working out', 'weight ?lifting', 'cold (shower|plunge|exposure)', 'sauna']

[[community.intervention]]
id = "reinstatement"
label = "Reinstating the original drug"
patterns = ['reinstat']

[[community.intervention]]
id = "lithium"
label = "Lithium"
patterns = ['lithium']

