# --------------------------------------------------------------------------
# Partitions: the whole report can be viewed through any of these lenses.
# A record belongs to a partition when it names one of the partition's drugs
# (by class or name, including brand names) or matches one of its `terms`.
# `paper_terms` apply to papers and trials only: on a patient forum "PSSD" is
# used whatever the causative drug was, so it says nothing about drug class there.
# A partition with no drugs or terms contains everything.
# --------------------------------------------------------------------------

[[partition]]
id = "all"
label = "All psychiatric medication"
description = "Everything: persistent sexual dysfunction after any psychiatric drug, plus related syndromes."

[[partition]]
id = "ssri_snri"
label = "SSRIs and SNRIs"
description = "Records that involve serotonin reuptake inhibitors."
classes = ["SSRI", "SNRI"]
terms = ['\bSSRIs?\b', '\bSNRIs?\b', 'serotonin[- ](and[- ])?(norepinephrine[- ]|noradrenaline[- ])?re-?uptake inhibit']
paper_terms = ['post-?SSRI', '\bPSSD\b']

[[partition]]
id = "ap_mirt"
label = "Antipsychotics and mirtazapine"
description = "Records that involve antipsychotics or mirtazapine."
classes = ["Antipsychotic"]
drugs = ["mirtazapine"]
terms = ['antipsychotic', 'neuroleptic', '\bNaSSA\b']

# --------------------------------------------------------------------------
# Patient reports (Reddit, forums). Anecdotal and self-selected: shown in their
# own section and never mixed into the evidence matrix. Only extracted tags and
# a link are stored; usernames are never collected and post text stays local.
# --------------------------------------------------------------------------

[community.reddit]
# Off by default. Reddit's Responsible Builder Policy requires explicit approval
# before any API access, says research use must go through its Reddit for
# Researchers programme, and prohibits processing data to infer health
# characteristics of users. Enable this only once Reddit has approved your use.
enabled = false
# Newest posts from these subreddits (Reddit serves at most ~1000 per listing).
subreddits = ["PSSD"]
# Extra searches to reach older posts about under-represented drugs.
[[community.reddit.search]]
subreddit = "PSSD"
q = "mirtazapine OR remeron"
[[community.reddit.search]]
subreddit = "PSSD"
q = "antipsychotic OR olanzapine OR zyprexa OR quetiapine OR seroquel OR risperidone OR aripiprazole OR abilify"
[[community.reddit.search]]
subreddit = "antipsychotics"
q = "PSSD OR \"sexual dysfunction\" OR \"genital numbness\" OR anhedonia"
[[community.reddit.search]]
subreddit = "mirtazapine"
q = "PSSD OR \"sexual dysfunction\" OR \"genital numbness\""
[[community.reddit.search]]
subreddit = "PSSD"
q = "recovered OR recovery OR improvement"

# Blogs and advocacy sites. kind = "wordpress" uses the site's own search API;
# kind = "rss" reads a feed. `delay` is the site's requested crawl delay in seconds.
# The two patient forums (pssdforum.org, survivingantidepressants.org) are not
# here: both block automated access. Use `pssd-atlas import` for pages you have
# saved from your own browser.
[[community.blog]]
name = "RxISK"
kind = "wordpress"
url = "https://rxisk.org"
search = ["PSSD", "post-SSRI"]
delay = 10
[[community.blog]]
name = "David Healy"
kind = "wordpress"
url = "https://davidhealy.org"
search = ["PSSD", "post-SSRI"]
delay = 10
[[community.blog]]
name = "Mad in America"
kind = "wordpress"
url = "https://www.madinamerica.com"
search = ["PSSD", "post-SSRI"]
delay = 3
[[community.blog]]
name = "PSSD Network: media"
kind = "rss"
url = "https://www.pssdnetwork.org/media?format=rss"
[[community.blog]]
name = "PSSD Canada: news"
kind = "rss"
url = "https://www.pssdcanada.ca/news?format=rss"
[[community.blog]]
name = "PSSD Canada: stories"
kind = "rss"
url = "https://www.pssdcanada.ca/our-stories?format=rss"

[[community.symptom]]
id = "genital_numbness"
label = "Genital numbness / reduced sensation"
patterns = ['genital (numb|an(a)?esthesia|hypo(a)?esthesia|sensation|sensitivity)', 'penile (an(a)?esthesia|sensitivity|sensation)', 'erogenous', 'numb (genital|penis|dick|clit|vagina)', '(penis|penile|clitor\w+|genital\w*) (is |feels? |are )?(numb|rubbery|dead)', 'no (genital )?sensation', 'reduced sensation', 'rubbery']

[[community.symptom]]
id = "libido"
label = "Loss of libido"
patterns = ['libido', 'sex drive', 'sexual desire', 'hypoactive', 'no (sexual )?desire', 'asexual']

[[community.symptom]]
id = "erectile"
label = "Erectile / arousal problems"
patterns = ['erectile', '\bED\b', 'erections?', "can'?t get (hard|aroused|wet)", 'lubricat', 'arousal']

