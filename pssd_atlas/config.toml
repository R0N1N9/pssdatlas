label = "Dose reduction / switching / drug holiday"
patterns = ['dose reduction', 'drug holiday', 'switch(ing|ed)? (to|from|antidepress)']

# --------------------------------------------------------------------------
# Pharmacovigilance grid (FDA Adverse Event Reporting System via openFDA).
# Reaction terms are MedDRA preferred terms. `control = true` drugs are
# comparators with no expected sexual-dysfunction signal.
# --------------------------------------------------------------------------

[faers]
reactions = [
  "SEXUAL DYSFUNCTION",
  "GENITAL HYPOAESTHESIA",
  "GENITAL ANAESTHESIA",
  "ANORGASMIA",
  "ORGASMIC SENSATION DECREASED",
  "ORGASM ABNORMAL",
  "LOSS OF LIBIDO",
  "LIBIDO DECREASED",
  "ERECTILE DYSFUNCTION",
  "EJACULATION DISORDER",
  "EJACULATION FAILURE",
  "EJACULATION DELAYED",
  "FEMALE ORGASMIC DISORDER",
  "FEMALE SEXUAL AROUSAL DISORDER",
  "EMOTIONAL POVERTY",
  "ANHEDONIA",
]
# Terms pooled into the per-drug "any sexual dysfunction" composite.
composite = [
  "SEXUAL DYSFUNCTION", "GENITAL HYPOAESTHESIA", "GENITAL ANAESTHESIA", "ANORGASMIA",
  "ORGASMIC SENSATION DECREASED", "ORGASM ABNORMAL", "LOSS OF LIBIDO", "LIBIDO DECREASED",
  "ERECTILE DYSFUNCTION", "EJACULATION DISORDER", "EJACULATION FAILURE", "EJACULATION DELAYED",
  "FEMALE ORGASMIC DISORDER", "FEMALE SEXUAL AROUSAL DISORDER",
]

